name: 경기 기록 수집 & 배포

on:
  schedule:
    # 한국시간 매일 17:07 ~ 01:07 매시 7분. 정각은 GitHub 사용량이 몰려 예약 실행이 늦어지거나 빠지기 쉬워 피한다
    - cron: "7 8-16 * * *"
  workflow_dispatch:          # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths: ["doosan_tracker/**", ".github/workflows/**"]

permissions:
  contents: write   # 새 경기 원본·선수 정보·순위표 커밋
  pages: write
  id-token: write
  actions: write    # 예약 실행 유지 (워크플로 '켜기' 호출)

concurrency:
  group: sync
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  sync:
    runs-on: ubuntu-24.04   # ubuntu-latest는 2026-10-19부터 26.04로 바뀌므로 고정
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # DB 캐시: 코드가 같으면 이전 실행의 DB를 이어 써서, 3천 경기가 넘는 원본을 매번 전부 다시 풀지 않는다
      # (코드가 바뀌면 키가 달라져 원본에서 새로 만든다)
      - uses: actions/cache@v6
        with:
          path: data/doosan.db
          key: db-${{ hashFiles('doosan_tracker/**') }}-${{ hashFiles('data/games/**') }}
          restore-keys: db-${{ hashFiles('doosan_tracker/**') }}-

      # 일부 경기 수집에 실패해도(종료 코드 1) 받은 경기는 커밋·배포하고, 실행 결과는 실패로 표시해 알림을 받는다
      - name: 경기 기록 수집 + 리포트 생성
        run: python -m doosan_tracker sync
        env:
          DOOSAN_ARCHIVE_KEY: ${{ secrets.DOOSAN_ARCHIVE_KEY }}   # 원본 암호 키 (저장소 Settings → Secrets)

      - name: 새 경기 원본·선수 정보·순위표 커밋
        if: ${{ !cancelled() }}
        run: |
          git add data/games data/players data/standings
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음"
          else
            # 내 계정(noreply 이메일)으로 커밋 → 자동 커밋도 잔디에 기록됨
            git config user.name "pcw7"
            git config user.email "58602643+pcw7@users.noreply.github.com"
            n=$(git diff --cached --name-only -- data/games | wc -l)
            if [ "$n" -gt 0 ]; then msg="기록 추가: ${n}경기"; else msg="선수 정보·순위 갱신"; fi
            git commit -m "$msg ($(date +'%Y-%m-%d %H:%M'))"
            git pull --rebase
            git push
          fi

      - if: ${{ !cancelled() }}
        uses: actions/configure-pages@v6
      - if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports
      - id: deploy
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v5

      # 공개 저장소는 60일 동안 커밋이 없으면 예약 실행이 꺼진다 (커밋이 없는 비시즌에 해당).
      # 워크플로 '켜기'를 다시 호출하면 그 기간이 새로 시작되므로 월요일 예약 실행 때(수동 실행 때도) 호출한다.
      # 커밋을 만들지 않아 잔디에는 영향이 없다. GitHub가 공식 보장하는 방법은 아니니 개막 전에 한 번 확인할 것.
      - name: 예약 실행 유지 (60일 비활성 꺼짐 방지)
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = schedule ] && [ "$(date +%u)" != 1 ]; then
            echo "월요일이 아니라 건너뜀"
            exit 0
          fi
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable"
          echo "예약 실행 유지 요청 완료"
