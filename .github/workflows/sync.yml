name: 경기 기록 수집 & 배포

# 실행 시각은 외부 서비스 cron-job.org가 정한다: 한국시간 매일 17:05 ~ 01:45, 20분마다 아래 workflow_dispatch를 호출.
# GitHub 자체 예약(schedule)은 쓰지 않는다 — 2026-10 실측 결과 예약 실행의 약 75%가 빠지고 최대 5시간씩 늦었다.
# 예약이 없으면 '60일 동안 활동이 없으면 예약 워크플로를 끈다'는 GitHub 규칙도 적용되지 않는다.
on:
  workflow_dispatch:          # cron-job.org가 20분마다 호출 (토큰: Actions 실행 권한만 가진 Fine-grained 토큰), Actions 탭에서 수동 실행도 가능
  push:
    branches: [main]
    paths: ["doosan_tracker/**", ".github/workflows/**"]

permissions:
  contents: write   # 새 경기 원본·선수 정보·순위표 커밋
  pages: write
  id-token: write

env:
  TZ: Asia/Seoul

# 수집과 배포를 나눈 이유: 2026-10-07 배포 환경(github-pages)이 'waiting'으로 4일간 멈추면서, 그 환경에 묶여 있던
# 작업 전체(수집 포함)가 시작조차 못 했고 뒤따르는 예약 실행도 전부 밀려 취소됐다.
# 이제 수집은 환경과 상관없이 돌고, 배포가 멈추면 다음 배포가 그것을 취소하고 대신 올라간다.
jobs:
  collect:
    runs-on: ubuntu-24.04   # ubuntu-latest는 2026-10-19부터 26.04로 바뀌므로 고정
    timeout-minutes: 20
    outputs:
      skip: ${{ steps.sync.outputs.skip }}
    concurrency:            # 수집은 겹치지 않게 하나씩 (커밋 충돌 방지)
      group: collect
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # DB 캐시: 코드가 같으면 이전 실행의 DB를 이어 써서, 3천 경기가 넘는 원본을 매번 전부 다시 풀지 않는다
      # (코드가 바뀌면 키가 달라져 원본에서 새로 만든다)
      - uses: actions/cache@v6
        with:
          path: data/doosan.db
          key: db-${{ hashFiles('doosan_tracker/**') }}-${{ hashFiles('data/games/**') }}
          restore-keys: db-${{ hashFiles('doosan_tracker/**') }}-

      # 일부 경기 수집에 실패해도(종료 코드 1) 받은 경기는 커밋·배포하고, 실행 결과는 실패로 표시해 알림을 받는다.
      # 네이버에 아예 닿지 않으면(2026-10-26 GitHub 서버에서만 시간 초과) skip=true를 남기고 아래 단계를 모두 건너뛴다:
      # 사이트는 지난 배포 그대로, 실패 메일은 마지막 성공이 24시간을 넘었을 때 하루 한 번만.
      - name: 경기 기록 수집 + 리포트 생성
        id: sync
        run: python -m doosan_tracker sync
        env:
          DOOSAN_ARCHIVE_KEY: ${{ secrets.DOOSAN_ARCHIVE_KEY }}   # 원본 암호 키 (저장소 Settings → Secrets)

      - name: 새 경기 원본·선수 정보·순위표 커밋
        if: ${{ !cancelled() && steps.sync.outputs.skip != 'true' }}
        run: |
          git add data/games data/players data/standings
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음"
          else
            # 내 계정(noreply 이메일)으로 커밋 → 자동 커밋도 잔디에 기록됨
            git config user.name "pcw7"
            git config user.email "58602643+pcw7@users.noreply.github.com"
            n=$(git diff --cached --name-only -- data/games | wc -l)
            if [ "$n" -gt 0 ]; then msg="기록 추가: ${n}경기"; else msg="선수 정보·순위 갱신"; fi
            git commit -m "$msg ($(date +'%Y-%m-%d %H:%M'))"
            git pull --rebase
            git push
          fi

      # 배포 작업이 받아 갈 웹사이트 파일
      - if: ${{ !cancelled() && steps.sync.outputs.skip != 'true' }}
        uses: actions/configure-pages@v6
      - if: ${{ !cancelled() && steps.sync.outputs.skip != 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports

  deploy:
    needs: collect
    # 수집이 일부 실패해도(종료 코드 1) 만들어진 사이트는 배포, 네이버에 닿지 않아 건너뛴 실행은 배포하지 않음
    if: ${{ !cancelled() && needs.collect.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:            # 배포는 항상 최신 사이트 전체를 올리므로, 멈춘 이전 배포는 새 배포가 취소하고 대신한다
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
