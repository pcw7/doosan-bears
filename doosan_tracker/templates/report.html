<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두산 베어스 기록</title>
<style>
:root {
  --navy: #131230; --red: #d4202c;
  --bg: #f5f6fa; --card: #ffffff; --text: #1b1d29; --muted: #6b6f80; --line: #e3e5ee;
  --win: #1f6feb; --loss: #d4202c; --draw: #8b8f9c; --hover: #f0f2f8; --accent: var(--navy);
  /* 그래프: 두 계열 색은 검증기(dataviz validate_palette) 통과 값, 축은 한 단계 진한 회색 */
  --s1: #2a78d6; --s2: #eb6834; --axis: #c3c6d4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1020; --card: #181a2e; --text: #e8e9f0; --muted: #9a9db0; --line: #2a2d45;
    --win: #5b9dff; --loss: #ff5a5f; --draw: #7c8091; --hover: #212440; --accent: #8f9bff;
    --s1: #3987e5; --s2: #d95926; --axis: #4a4e6e;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
header { background: var(--navy); color: #fff; padding: 28px 16px 22px; border-bottom: 4px solid var(--red); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
header .wrap { padding: 0; max-width: 1148px; }
/* 좁은 화면: 순위표는 본문 위에 접힌 상태 / 넓은 화면: 왼쪽에 펼쳐 두고 스크롤을 따라다님 */
.layout { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
main { min-width: 0; }
@media (min-width: 1200px) {
  .layout { max-width: 1460px; display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 20px; align-items: start; }
  header .wrap { max-width: 1428px; }
  #side { position: sticky; top: 16px; }
  #side summary { display: none; }
}
#side .card { padding: 12px 12px 10px; }
#side summary { cursor: pointer; font-weight: 600; }
.side-hd { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0; }
.side-hd span { font-size: 12px; color: var(--muted); }
table.stand th, table.stand td { padding: 5px 4px; font-size: 12.5px; }
table.stand tr.me td { background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 700; }
table.stand tr.cut td { border-bottom: 1.5px dashed var(--muted); }
h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -0.02em; }
#seasonSel { font: inherit; color: #fff; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .35);
  border-radius: 8px; padding: 0 4px; cursor: pointer; }
#seasonSel option { color: #1b1d29; background: #fff; }
.hrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.search { position: relative; }
#search { width: 220px; padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .35);
  background: rgba(255, 255, 255, .12); color: #fff; font: inherit; }
#search::placeholder { color: #b9bbd6; }
#search:focus { outline: none; background: rgba(255, 255, 255, .2); }
#searchResults { position: absolute; right: 0; top: calc(100% + 6px); width: min(380px, 92vw); max-height: 60vh; overflow: auto;
  z-index: 20; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, .25); padding: 4px; }
.sr { padding: 8px 10px; border-radius: 8px; font-size: 13px; }
.sr:hover { background: var(--hover); }
.srn { font-weight: 700; color: var(--accent); text-decoration: none; }
.srs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.srs a { font-size: 11px; padding: 0 6px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); text-decoration: none; }
.srs a:hover { border-color: var(--accent); color: var(--accent); }
@media (max-width: 600px) { .search, #search { width: 100%; } #searchResults { left: 0; width: 100%; } }
.sub { color: #b9bbd6; font-size: 13px; }
.summary { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 18px; align-items: flex-end; }
.stat .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: #b9bbd6; }
.strip { display: flex; gap: 3px; }
.strip span { width: 22px; height: 22px; border-radius: 4px; display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: #fff; }
.W { background: var(--win); } .L { background: var(--loss); } .D { background: var(--draw); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.card h2 { margin: 0 0 12px; font-size: 16px; }
.upcoming { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.up { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.up .d { color: var(--muted); font-size: 12px; }
.up .o { font-weight: 600; margin-top: 2px; }
.up.big { grid-column: 1 / -1; }
.matchup { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin: 10px 0 8px;
  padding: 10px 12px; background: var(--hover); border-radius: 8px; font-size: 13px; line-height: 1.7; }
.matchup .sp:last-child { text-align: right; }
.vsx { font-weight: 800; color: var(--muted); }
.pvrow { display: flex; gap: 12px; font-size: 13px; padding: 3px 0; flex-wrap: wrap; align-items: center; }
.pvrow .k { color: var(--muted); min-width: 92px; }
.pvrow .gap { display: inline-block; width: 10px; }
.strip.sm { display: inline-flex; vertical-align: middle; }
.strip.sm span { width: 18px; height: 18px; font-size: 10px; }
.live { color: var(--red); font-weight: 700; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs button { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 6px 12px;
  border-radius: 999px; cursor: pointer; font: inherit; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (prefers-color-scheme: dark) { .tabs button.on { color: #0f1020; } }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
th.sort { cursor: pointer; user-select: none; }
th.sort:hover { color: var(--text); }
th.asc::after { content: " ▲"; } th.desc::after { content: " ▼"; }
td.l, th.l { text-align: left; }
tbody tr:hover { background: var(--hover); }
.name { color: var(--accent); cursor: pointer; font-weight: 600; }
.name:hover { text-decoration: underline; }
.res { display: inline-block; width: 22px; text-align: center; border-radius: 4px; color: #fff; font-weight: 700; font-size: 12px; }
.muted { color: var(--muted); }
.ha { display: inline-block; width: 2.9em; margin-right: 6px; border: 1px solid var(--accent); border-radius: 4px;
  font-size: 11px; font-weight: 600; line-height: 17px; text-align: center; vertical-align: 1px; }
.ha.H { background: var(--accent); color: #fff; }
.ha.A { color: var(--accent); }
@media (prefers-color-scheme: dark) { .ha.H { color: #0f1020; } }
tr.muted .ha { opacity: .55; }
tr.game { cursor: pointer; }
.more { display: block; margin: 14px auto 2px; padding: 8px 22px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--card); color: var(--text); font: inherit; cursor: pointer; }
.more:hover { background: var(--hover); }
tr.box > td { padding: 0; background: var(--hover); }
.boxin { padding: 12px; display: grid; gap: 12px; }
.boxin table { background: var(--card); border-radius: 6px; }
.notes { font-size: 12px; color: var(--muted); line-height: 1.7; }
.notes b { color: var(--text); font-weight: 600; }
.pa { font-size: 12px; color: var(--muted); text-align: left; }
.sec h3 { font-size: 14px; margin: 24px 0 4px; }
.sec > h3:first-child { margin-top: 4px; }
.note { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.note.warn { color: var(--loss); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 0 28px; }
.grid2 > div { min-width: 0; }
.pos { color: var(--win); font-weight: 600; } .neg { color: var(--loss); font-weight: 600; }
.tag { display: inline-block; margin-left: 6px; padding: 0 5px; border: 1px solid var(--muted); border-radius: 4px;
  color: var(--muted); font-size: 11px; font-weight: 600; line-height: 16px; vertical-align: 1px; cursor: help; }
.notice { border: 1px solid var(--line); background: var(--hover); border-radius: 8px; padding: 10px 12px; margin-bottom: 4px; }
.notice .nt { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.notice .nt .tag { margin: 0 4px 0 0; }
.grp { font-size: 14px; margin: 18px 0 8px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pcard { border: 1px solid var(--line); border-radius: 10px; padding: 12px 10px; text-align: center; cursor: pointer; }
.pcard:hover { border-color: var(--accent); background: var(--hover); }
.pcard .nm { font-weight: 700; }
.pcard .ps { font-size: 12px; color: var(--muted); }
.pcard .st { font-size: 12px; margin-top: 6px; }
.pno { color: var(--accent); font-weight: 800; font-variant-numeric: tabular-nums; }
.ph { position: relative; width: 84px; height: 84px; margin: 0 auto 8px; border-radius: 50%; overflow: hidden;
  background: var(--hover); display: grid; place-items: center; color: var(--muted); font-size: 28px; font-weight: 700; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
/* 시즌 흐름 그래프: 선 2px, 막대 24px 이하·윗면만 둥글게, 격자는 실선 헤어라인, 끝점은 바탕색 고리 */
.chart { position: relative; margin: 4px 0 6px; outline: none; }
.chart:focus-visible { box-shadow: 0 0 0 2px var(--accent); border-radius: 6px; }
.chart svg { display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
.chart .base { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.chart .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .lbl { fill: var(--text); font-size: 12px; font-weight: 700; }
.chart .note { fill: var(--muted); font-size: 11px; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .end { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.chart .band { fill: var(--accent); opacity: .06; }
.chart .pos { fill: var(--win); opacity: .14; }
.chart .neg { fill: var(--loss); opacity: .14; }
.chart .xh { stroke: var(--muted); stroke-width: 1; }
.chart .xdot { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.chart .b1 { fill: var(--s1); } .chart .b2 { fill: var(--s2); }
.chart .hit { fill: transparent; } .chart .hit:hover, .chart .hit.on { fill: var(--hover); }
.ctip { position: absolute; z-index: 5; pointer-events: none; background: var(--card); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; line-height: 1.6;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .15); white-space: nowrap; }
.ctip .tt { color: var(--muted); }
.ctip b { font-size: 13px; }
.ctip .key { display: inline-block; width: 10px; height: 2px; margin-right: 6px; vertical-align: middle; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: 2px 0 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.sec a { color: var(--accent); text-decoration: none; }
.sec a:hover { text-decoration: underline; }
tr.champ td { background: color-mix(in srgb, #e0a800 14%, transparent); }
tr.champ .post { color: #b07d00; font-weight: 700; }
@media (prefers-color-scheme: dark) { tr.champ .post { color: #f0c040; } }
.recs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.rec { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.rec .rk { font-weight: 700; margin-bottom: 2px; }
.rec ol { margin: 0; padding-left: 20px; font-size: 13px; line-height: 1.9; }
.rec li b { float: right; font-variant-numeric: tabular-nums; }
.leads { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin-bottom: 4px; }
.pcard.lead { display: flex; gap: 10px; align-items: center; text-align: left; padding: 8px 10px; }
.lead .lk { font-size: 12px; color: var(--muted); }
.lead .nm { font-size: 13px; }
.lead .lv { font-size: 18px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.2; }
.ph.sm { width: 48px; height: 48px; margin: 0; font-size: 18px; flex: none; }
.ph.big { width: 112px; height: 112px; margin: 0; border-radius: 12px; font-size: 40px; flex: none; }
.prof { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 12px; }
.prof .pt { font-size: 18px; margin-bottom: 6px; }
.prof dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 0; font-size: 13px; }
.prof dt { color: var(--muted); }
.prof dd { margin: 0; }
.nrow { display: grid; grid-template-columns: 110px 1fr; font-size: 13px; line-height: 1.9; }
.nrow > span:first-child { color: var(--muted); }
.filters { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; color: var(--muted); font-size: 13px; }
/* 창 자체는 스크롤하지 않고(.bd만 스크롤) 열려 있는 동안 뒤 페이지 스크롤도 잠가 스크롤바가 하나만 보이게 한다 */
dialog { border: none; border-radius: 12px; padding: 0; width: min(920px, 96vw); max-height: 88vh; overflow: hidden;
  background: var(--card); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: rgba(10, 10, 30, .55); }
dialog .hd { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px;
  border-bottom: 1px solid var(--line); flex: none; }
dialog .bd { padding: 12px 16px 16px; overflow: auto; flex: 1; min-height: 0; }
html { scrollbar-gutter: stable; }
body:has(dialog[open]) { overflow: hidden; }
dialog button.x { border: none; background: none; color: var(--muted); font-size: 22px; cursor: pointer; }
.empty { color: var(--muted); padding: 20px 0; text-align: center; }
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 20px; }
</style>
</head>
<body>
<header><div class="wrap" id="hdr"></div></header>
<div class="layout">
  <aside id="side" hidden></aside>
  <main>
    <section class="card" id="upcomingCard" hidden><h2>다음 경기</h2><div class="upcoming" id="upcoming"></div></section>
    <section class="card">
      <div class="tabs" id="stageTabs"></div>
      <div class="tabs" id="viewTabs"></div>
      <div id="view"></div>
    </section>
  </main>
</div>
<footer id="foot"></footer>
<dialog id="dlg"><div class="hd"><strong id="dlgTitle"></strong><button class="x" onclick="dlg.close()">×</button></div><div class="bd" id="dlgBody"></div></dialog>

<script>
const DATA = /*__DATA__*/null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rate = (v, d = 3) => v == null ? "-" : (d === 3 ? v.toFixed(3).replace(/^0/, "") : v.toFixed(d));
const DEC = { W: "승", L: "패", S: "세", H: "홀" };
const RES = { W: "승", L: "패", D: "무" };
const fmtDate = (d) => { const [, m, day] = d.split("-"); const w = "일월화수목금토"[new Date(d + "T00:00").getDay()]; return `${+m}/${+day}(${w})`; };
const HA = { H: "홈", A: "원정" };
const vs = (g) => `${g.opp} ${HA[g.ha]}`;  // 툴팁용 텍스트
const opp = (g) => `<span class="ha ${g.ha}">${HA[g.ha]}</span>${esc(g.opp)}`;
const finals = DATA.games.filter((g) => g.status === "FINAL");
let stage = Object.keys(DATA.stages)[0] || "regular";
let view = "games";

function header() {
  const reg = DATA.stages.regular;
  const r = reg ? reg.record : null;
  const st = DATA.standings;
  const recent = finals.filter((g) => g.stage === "regular").slice(-10);
  let streak = "";
  const last = finals.filter((g) => g.stage === "regular" && g.result !== "D");
  if (last.length) {
    const t = last[last.length - 1].result; let n = 0;
    for (let i = last.length - 1; i >= 0 && last[i].result === t; i--) n++;
    streak = `${n}연${t === "W" ? "승" : "패"}`;
  }
  const done = DATA.regularDone;  // 정규시즌 종료 (포스트시즌이 남아 있어도 순위·연속 기록은 '최종')
  const latest = DATA.seasons[0];
  const seasonPicker = DATA.seasons.length > 1
    ? `<select id="seasonSel" aria-label="시즌 선택">${DATA.seasons.map((s) => `<option value="${s}" ${s === DATA.season ? "selected" : ""}>${s}</option>`).join("")}</select>`
    : DATA.season;
  $("#hdr").innerHTML = `
    <div class="hrow"><h1>${esc(DATA.team)} ${seasonPicker} 시즌 기록</h1>
      <div class="search"><input id="search" type="search" placeholder="선수 검색 (${DATA.seasons.at(-1)}~)" autocomplete="off" aria-label="선수 검색">
      <div id="searchResults" hidden></div></div></div>
    <div class="sub">마지막 동기화 ${esc((DATA.lastSync || "").replace("T", " "))} · 리포트 생성 ${esc(DATA.generatedAt)}</div>
    <div class="summary">
      ${r ? `<div class="stat"><div class="v">${r.w}승 ${r.l}패 ${r.d}무</div><div class="k">정규시즌 (${r.g}경기)</div></div>
             <div class="stat"><div class="v">${rate(r.pct)}</div><div class="k">승률</div></div>` : ""}
      ${st && st.rank ? `<div class="stat"><div class="v">${st.rank}위</div><div class="k">${done ? "최종 순위" : `순위 (${fmtDate(st.game_date)} 기준)`}</div></div>` : ""}
      ${postseason()}
      ${r ? `<div class="stat"><div class="v">${r.rs} / ${r.ra}</div><div class="k">득점 / 실점</div></div>` : ""}
      ${streak ? `<div class="stat"><div class="v">${streak}</div><div class="k">${done ? "시즌 마지막 연속" : "현재 연속"}</div></div>` : ""}
      ${recent.length ? `<div class="stat"><div class="strip">${recent.map((g) => `<span class="${g.result}" title="${fmtDate(g.date)} ${esc(vs(g))} ${g.ts}-${g.os}">${RES[g.result]}</span>`).join("")}</div><div class="k">${done ? "시즌 마지막" : "최근"} ${recent.length}경기</div></div>` : ""}
    </div>`;
  const sel = $("#seasonSel");
  if (sel) sel.onchange = () => { location.href = +sel.value === latest ? "index.html" : `${sel.value}.html`; };
  setupSearch();
}

// 선수 검색: 모든 시즌의 두산 선수 중 이름에 검색어가 들어간 선수. 이름 → 마지막 시즌, 연도 → 그 시즌 기록 창
function setupSearch() {
  const box = $("#search"), out = $("#searchResults");
  const all = Object.entries(DATA.index || {});
  const ranges = (ss) => {  // [2008, 2009, 2010, 2015] → "2008–2010, 2015"
    const parts = [];
    let a = ss[0], b = ss[0];
    for (const s of [...ss.slice(1), null]) {
      if (s === b + 1) { b = s; continue; }
      parts.push(a === b ? `${a}` : `${a}–${b}`);
      a = b = s;
    }
    return parts.join(", ");
  };
  const show = () => {
    const q = box.value.trim();
    if (!q) { out.hidden = true; return; }
    const hits = all.filter(([, p]) => p.n.includes(q))
      .sort((x, y) => (y[1].s.at(-1) - x[1].s.at(-1)) || x[1].n.localeCompare(y[1].n, "ko")).slice(0, 12);
    out.innerHTML = hits.length ? hits.map(([pid, p]) => `<div class="sr">
        <a class="srn" href="${seasonHref(p.s.at(-1))}#p=${pid}">${esc(p.n)}</a> <span class="muted">${esc(p.p || "")} · ${ranges(p.s)}</span>
        <div class="srs">${p.s.slice().reverse().map((s) => `<a href="${seasonHref(s)}#p=${pid}">${s}</a>`).join("")}</div></div>`).join("")
      : `<div class="sr muted">'${esc(q)}' 선수가 없습니다</div>`;
    out.hidden = false;
  };
  box.addEventListener("input", show);
  box.addEventListener("focus", show);
  box.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { const a = out.querySelector("a.srn"); if (a) { out.hidden = true; location.href = a.href; } }
    if (e.key === "Escape") { out.hidden = true; box.blur(); }
  });
  out.addEventListener("click", (e) => { if (e.target.closest("a")) out.hidden = true; });
  document.addEventListener("click", (e) => { if (!e.target.closest(".search")) out.hidden = true; });
}

// 포스트시즌 성적: 결과 문구(우승·탈락·진출·진행 중)는 시리즈 전적으로 판단한 DATA.post
function postseason() {
  const ps = finals.filter((g) => g.stage === "postseason");
  if (!ps.length || !DATA.post) return "";
  const w = ps.filter((g) => g.result === "W").length, l = ps.filter((g) => g.result === "L").length;
  const label = DATA.post === "우승" || DATA.post === "준우승" ? `한국시리즈 ${DATA.post}` : DATA.post;
  return `<div class="stat"><div class="v">${esc(label)}</div><div class="k">포스트시즌 ${w}승 ${l}패</div></div>`;
}

// 포스트시즌 시리즈 전적 (두산 기준). 와일드카드는 정규시즌 4위 팀이 1승을 안고 시작한다 (2015년~)
const SERIES_WINS = { "와일드카드": 2, "준플레이오프": 3, "플레이오프": 3, "한국시리즈": 4 };
function series(round, upto) {  // upto 경기까지 (없으면 지금까지)
  const games = finals.filter((g) => g.stage === "postseason" && g.round === round);
  const n = upto ? games.indexOf(upto) + 1 : games.length;
  const played = games.slice(0, n);
  let w = played.filter((g) => g.result === "W").length, l = played.filter((g) => g.result === "L").length;
  const rank = DATA.standings && DATA.standings.rank;
  if (round === "와일드카드") { w += rank === 4; l += rank === 5; }
  return { n, w, l, decided: Math.max(w, l) >= (SERIES_WINS[round] || Infinity) };
}

function upcoming() {
  const n = new Date();
  const today = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`;
  // 이미 끝난 포스트시즌 시리즈의 '필요 시' 경기는 일정에 남아 있어도 빼고 보여준다
  const list = DATA.games.filter((g) => (g.status === "SCHEDULED" || g.status === "LIVE") && g.date >= today
    && !(g.stage === "postseason" && series(g.round).decided)).slice(0, 4);
  if (!list.length) return;
  $("#upcomingCard").hidden = false;
  const nth = {};  // 포스트시즌: 라운드별 N차전, 첫 경기에는 지금까지 시리즈 전적
  for (const g of list) {
    if (g.stage !== "postseason") continue;
    const s = series(g.round);
    nth[g.id] = `${esc(g.round)} ${s.n + 1 + list.filter((x) => x.round === g.round && x.date < g.date).length}차전`
      + (g === list[0] ? ` · 시리즈 ${s.w}승 ${s.l}패${g.round === "와일드카드" ? " (4위 1승 포함)" : ""}` : "");
  }
  const round = (g) => nth[g.id] || esc(g.round);
  const simple = (g) => `
    <div class="up"><div class="d">${fmtDate(g.date)} ${esc(g.time || "")} · ${esc(g.stadium || "")} · ${round(g)}</div>
    <div class="o">${opp(g)} ${g.status === "LIVE" ? '<span class="live">● 진행 중</span>' : ""}</div>
    <div class="d">선발: ${esc(g.starter || "미정")} vs ${esc(g.oppStarter || "미정")}</div></div>`;
  const pv = (DATA.previews || {})[list[0].id];
  $("#upcoming").innerHTML = (pv && list[0].status === "SCHEDULED" ? previewCard(list[0], pv, round(list[0])) : simple(list[0]))
    + list.slice(1).map(simple).join("");
}

// 다음 경기 미리보기: 선발 매치업(시즌·상대 전적), 시즌 맞대결, 양 팀 최근 5경기, 순위
function previewCard(g, pv, round) {
  const starter = (s, team, vsName) => s
    ? `<div class="sp"><div><span class="pno">${esc(s.no || "")}</span> <b>${esc(s.name)}</b> <span class="muted">${esc(team)}</span></div>
       <div>${s.season.g ?? 0}경기 ${s.season.w ?? 0}승 ${s.season.l ?? 0}패 · ERA <b>${esc(s.season.era ?? "-")}</b></div>
       <div class="muted">${esc(vsName)}전 ${s.vs.g ?? 0}경기 ${s.vs.w ?? 0}승 ${s.vs.l ?? 0}패 · ERA ${esc(s.vs.era ?? "-")}</div></div>`
    : `<div class="sp muted">${esc(team)} 선발 미정</div>`;
  const strip = (r) => `<span class="strip sm">${r.map((x) => `<span class="${x}">${RES[x]}</span>`).join("")}</span>`;
  const rank = (s) => s && s.rank ? `${s.rank}위 (${s.w}승 ${s.l}패 ${s.d}무)` : "";
  const v = pv.vs || {};
  return `<div class="up big">
    <div class="d">${fmtDate(g.date)} ${esc(g.time || "")} · ${esc(g.stadium || "")} · ${round}</div>
    <div class="o">${opp(g)}</div>
    <div class="matchup">${starter(pv.team_starter, "두산", g.opp)}<div class="vsx">VS</div>${starter(pv.opp_starter, g.opp, "두산")}</div>
    <div class="pvrow"><span class="k">${g.stage === "postseason" ? "정규시즌" : "시즌"} 상대 전적</span><span><b>${v.w ?? 0}승 ${v.l ?? 0}패 ${v.d ?? 0}무</b> <span class="muted">(두산 기준)</span></span></div>
    <div class="pvrow"><span class="k">최근 5경기</span><span>두산 ${strip(pv.team_recent || [])} <span class="gap"></span> ${esc(g.opp)} ${strip(pv.opp_recent || [])}</span></div>
    <div class="pvrow"><span class="k">순위</span><span>두산 ${rank(pv.team_standing)} · ${esc(g.opp)} ${rank(pv.opp_standing)}</span></div>
  </div>`;
}

// 왼쪽 리그 순위표. 점선 위가 포스트시즌 진출권 (2014년까지 상위 4팀, 2015년부터 5팀)
function standings() {
  const L = DATA.league;
  if (!L || !L.teams.length) return;
  const cut = DATA.season <= 2014 ? 4 : 5;
  const me = L.teams.find((t) => t.id === "OB");
  const when = DATA.regularDone ? "정규시즌 최종" : `${fmtDate(L.as_of)} 기준`;
  const gb = (v) => !v ? "-" : (Number.isInteger(v) ? v : v.toFixed(1));
  const rows = L.teams.map((t, i) => `<tr class="${t.id === "OB" ? "me" : ""} ${i === cut - 1 ? "cut" : ""}" title="${esc(`최근 5경기 ${t.last5 || "-"} · ${t.streak || ""}`)}">
    <td>${t.rank}</td><td class="l">${esc(t.name)}</td><td>${t.w}</td><td>${t.l}</td><td>${t.d}</td><td>${rate(t.pct)}</td><td>${gb(t.gb)}</td></tr>`).join("");
  const side = $("#side");
  side.hidden = false;
  side.innerHTML = `<details class="card" id="standBox">
    <summary>KBO 순위${me ? ` · 두산 ${me.rank}위` : ""} <span class="muted">${when}</span></summary>
    <div class="side-hd"><b>${DATA.season} KBO 순위</b><span>${when}</span></div>
    <table class="stand"><thead><tr><th></th><th class="l">팀</th><th>승</th><th>패</th><th>무</th><th>승률</th><th>차</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="note" style="margin: 8px 0 0">점선 위 ${cut}팀: 포스트시즌 진출${DATA.regularDone ? "" : "권"}</p></details>`;
  const box = $("#standBox"), wide = matchMedia("(min-width: 1200px)");
  box.open = wide.matches;
  wide.addEventListener("change", (e) => { if (e.matches) box.open = true; });
}

function tabs() {
  const stages = Object.entries(DATA.stages);
  $("#stageTabs").innerHTML = stages.map(([k, s]) => `<button data-s="${k}" class="${k === stage ? "on" : ""}">${s.label}</button>`).join("");
  $("#stageTabs").hidden = view === "history" || view === "flow";  // 역대 기록·시즌 흐름은 경기 구분과 상관없음 (흐름은 정규시즌)
  $("#viewTabs").innerHTML = [["games", "경기 결과"], ["players", "선수"], ["batting", "타자 기록"], ["pitching", "투수 기록"], ["team", "팀 기록"], ["flow", "시즌 흐름"], ["history", "역대 기록"]]
    .map(([k, l]) => `<button data-v="${k}" class="${k === view ? "on" : ""}">${l}</button>`).join("");
  document.querySelectorAll("#stageTabs button").forEach((b) => b.onclick = () => { stage = b.dataset.s; delete pagers.games; render(); });
  document.querySelectorAll("#viewTabs button").forEach((b) => b.onclick = () => { view = b.dataset.v; render(); });
}

function boxScore(g) {
  const inn = g.line || { team: [], opponent: [] };
  const n = Math.max(9, (inn.team || []).length, (inn.opponent || []).length);
  const cells = (arr) => Array.from({ length: n }, (_, i) => `<td>${arr && arr[i] != null ? arr[i] : ""}</td>`).join("");
  const [th, te, tb, oh, oe, ob] = g.rheb;
  const awayFirst = g.ha === "A";
  const teamRow = `<tr><td class="l"><b>두산</b></td>${cells(inn.team)}<td><b>${g.ts}</b></td><td>${th ?? ""}</td><td>${te ?? ""}</td><td>${tb ?? ""}</td></tr>`;
  const oppRow = `<tr><td class="l">${esc(g.opp)}</td>${cells(inn.opponent)}<td><b>${g.os}</b></td><td>${oh ?? ""}</td><td>${oe ?? ""}</td><td>${ob ?? ""}</td></tr>`;
  const line = `<div class="scroll"><table><thead><tr><th class="l"></th>${Array.from({ length: n }, (_, i) => `<th>${i + 1}</th>`).join("")}<th>R</th><th>H</th><th>E</th><th>B</th></tr></thead>
    <tbody>${awayFirst ? teamRow + oppRow : oppRow + teamRow}</tbody></table></div>`;
  const bat = `<div class="scroll"><table><thead><tr><th>타순</th><th class="l">선수</th><th class="l">위치</th><th>타수</th><th>득점</th><th>안타</th><th>홈런</th><th>타점</th><th>볼넷</th><th>삼진</th><th>도루</th><th class="l">타석 결과</th></tr></thead><tbody>
    ${g.bat.map((b) => `<tr><td>${b.sub ? "" : b.o}</td><td class="l">${b.sub ? "&nbsp;&nbsp;" : ""}<span class="name" data-pid="${b.pid}">${esc(b.name)}</span></td><td class="l">${esc(b.pos)}</td>
      <td>${b.ab}</td><td>${b.r}</td><td>${b.h}</td><td>${b.hr}</td><td>${b.rbi}</td><td>${b.bb}</td><td>${b.so}</td><td>${b.sb}</td><td class="pa">${esc(b.res)}</td></tr>`).join("")}
    </tbody></table></div>`;
  const pit = `<div class="scroll"><table><thead><tr><th class="l">투수</th><th>결과</th><th>이닝</th><th>타자</th><th>피안타</th><th>실점</th><th>자책</th><th>볼넷</th><th>삼진</th><th>피홈런</th><th>투구수</th></tr></thead><tbody>
    ${g.pit.map((p) => `<tr><td class="l"><span class="name" data-pid="${p.pid}">${esc(p.name)}</span></td><td>${DEC[p.dec] || ""}</td><td>${esc(p.ip)}</td><td>${p.bf}</td><td>${p.h}</td><td>${p.r}</td><td>${p.er}</td><td>${p.bb}</td><td>${p.so}</td><td>${p.hr}</td><td>${p.np}</td></tr>`).join("")}
    </tbody></table></div>`;
  const notes = g.notes.length ? `<div class="notes">${g.notes.map((n) => `<b>${esc(n.how)}</b> ${esc(n.result)}`).join("<br>")}</div>` : "";
  return `<div class="boxin">${line}${bat}${pit}${notes}</div>`;
}

// ── 더보기 목록 ── 처음 PAGE개만 보여주고, 버튼을 누르면 아래에 PAGE개씩 이어 붙인다.
// 다시 그리지 않고 이어 붙이므로 펼쳐 둔 박스스코어와 스크롤 위치가 유지된다.
const PAGE = 20;
const pagers = {};      // 목록 id → { rows: 행 HTML 배열, shown: 보여준 개수 }
const moreLabel = (left) => `더보기 <span class="muted">· ${left}경기 남음</span>`;

// keep=true면 같은 id로 이전에 펼쳐 둔 개수를 유지한다 (탭을 오갔다 돌아올 때)
function paged(id, rows, keep = false) {
  const shown = Math.min(keep && pagers[id] ? pagers[id].shown : PAGE, rows.length);
  pagers[id] = { rows, shown };
  const left = rows.length - shown;
  return [`<tbody id="${id}">${rows.slice(0, shown).join("")}</tbody>`,
          left > 0 ? `<button class="more" data-more="${id}">${moreLabel(left)}</button>` : ""];
}

function showMore(id) {
  const p = pagers[id];
  document.getElementById(id).insertAdjacentHTML("beforeend", p.rows.slice(p.shown, p.shown + PAGE).join(""));
  p.shown = Math.min(p.shown + PAGE, p.rows.length);
  const btn = document.querySelector(`[data-more="${id}"]`);
  const left = p.rows.length - p.shown;
  if (left > 0) btn.innerHTML = moreLabel(left); else btn.remove();
}

const gameList = () => DATA.games.filter((g) => g.stage === stage && (g.status === "FINAL" || g.status === "CANCELLED")).reverse();
// 포스트시즌: 날짜 옆에 'N차전', 결과 옆에 그 경기까지의 시리즈 전적
const psInfo = (g) => {
  if (g.stage !== "postseason" || g.status !== "FINAL") return ["", ""];
  const s = series(g.round, g);
  return [` <span class="muted">${esc(g.round)} ${s.n}차전</span>`, ` <span class="muted">${s.w}승 ${s.l}패</span>`];
};
const gameRow = (g) => { const [nth, sr] = psInfo(g); return g.status === "CANCELLED"
  ? `<tr class="muted"><td class="l">${fmtDate(g.date)}</td><td class="l">${opp(g)}</td><td class="l">${esc(g.stadium || "")}</td><td colspan="6" class="l">경기 취소</td></tr>`
  : `<tr class="game" data-id="${g.id}"><td class="l">${fmtDate(g.date)}${nth}</td><td class="l">${opp(g)}</td><td class="l">${esc(g.stadium || "")}</td>
     <td><b>${g.ts}</b> : ${g.os}</td><td><span class="res ${g.result}">${RES[g.result]}</span>${sr}</td>
     <td class="l">${esc(g.wp || "")}</td><td class="l">${esc(g.lp || "")}</td><td class="l">${esc(g.sp || "")}</td><td class="l">${esc(g.starter || "")}</td></tr>`; };

function gamesView() {
  const list = gameList();
  if (!list.length) return `<div class="empty">기록된 경기가 없습니다</div>`;
  const [body, more] = paged("games", list.map(gameRow), true);
  const wc = list.some((g) => g.round === "와일드카드")
    ? `<p class="note">와일드카드 결정전은 정규시즌 4위 팀이 1승을 안고 시작합니다 (시리즈 전적에 포함).</p>` : "";
  return `${wc}<div class="scroll"><table><thead><tr><th class="l">날짜</th><th class="l">상대</th><th class="l">구장</th><th>스코어</th><th>결과</th><th class="l">승리투수</th><th class="l">패전투수</th><th class="l">세이브</th><th class="l">선발</th></tr></thead>
    ${body}</table></div>${more}`;
}

function toggleBox(tr) {
  const next = tr.nextElementSibling;
  if (next && next.classList.contains("box")) { next.remove(); return; }
  const g = DATA.games.find((x) => x.id === tr.dataset.id);
  tr.insertAdjacentHTML("afterend", `<tr class="box"><td colspan="9">${boxScore(g)}</td></tr>`);
}

const BAT_COLS = [["name", "선수", "l"], ["g", "경기"], ["pa", "타석"], ["ab", "타수"], ["r", "득점"], ["h", "안타"], ["b2", "2루타"], ["b3", "3루타"], ["hr", "홈런"], ["rbi", "타점"], ["bb", "볼넷"], ["hbp", "사구"], ["so", "삼진"], ["sb", "도루"], ["avg", "타율", "r3"], ["obp", "출루율", "r3"], ["slg", "장타율", "r3"], ["ops", "OPS", "r3"]];
const PIT_COLS = [["name", "선수", "l"], ["g", "경기"], ["gs", "선발"], ["w", "승"], ["l", "패"], ["sv", "세"], ["hld", "홀"], ["outs", "이닝", "ip"], ["h", "피안타"], ["r", "실점"], ["er", "자책"], ["bb", "볼넷"], ["so", "삼진"], ["hr", "피홈런"], ["era", "ERA", "r2"], ["whip", "WHIP", "r2"], ["k9", "K/9", "r2"], ["pitches", "투구수"]];
const sortState = { batting: ["pa", -1], pitching: ["outs", -1] };
let qualifiedOnly = false;

// 자료에 선수 기록이 없는 경기가 있으면 알려준다 (2011년 투수 기록, 2008년 포스트시즌 등)
function missNote(kind) {
  const s = DATA.stages[stage];
  const miss = s && s.missing ? s.missing[kind] : 0;
  if (!miss) return "";
  const who = kind === "batting" ? "타자" : "투수";
  return `<p class="note warn">ⓘ ${miss === s.record.g ? `이 시즌은 자료에 ${who} 기록이 없습니다.` : `${s.record.g}경기 중 ${miss}경기는 자료에 ${who} 기록이 없어 선수 기록 합계에서 빠져 있습니다.`}</p>`;
}

function statsView(kind) {
  const s = DATA.stages[stage];
  if (!s) return "";
  const cols = kind === "batting" ? BAT_COLS : PIT_COLS;
  let rows = s[kind].slice();
  const g = s.record.g;
  const minPa = Math.floor(g * 3.1), minOuts = g * 3;
  if (qualifiedOnly) rows = rows.filter((r) => kind === "batting" ? r.pa >= minPa : r.outs >= minOuts);
  const [key, dir] = sortState[kind];
  rows.sort((a, b) => {
    const x = a[key], y = b[key];
    if (x == null) return 1; if (y == null) return -1;
    return typeof x === "string" ? dir * x.localeCompare(y, "ko") : dir * (x - y);
  });
  const fmt = (r, [k, , t]) => t === "r3" ? rate(r[k]) : t === "r2" ? rate(r[k], 2) : t === "ip" ? esc(r.ip) : r[k];
  const label = kind === "batting" ? `규정타석(${minPa}) 이상만` : `규정이닝(${g}) 이상만`;
  return `${missNote(kind)}<div class="filters"><label><input type="checkbox" id="qual" ${qualifiedOnly ? "checked" : ""}> ${label}</label><span>${rows.length}명 · 열 제목을 누르면 정렬</span></div>
    <div class="scroll"><table><thead><tr>${cols.map(([k, l, t]) => `<th class="sort ${t === "l" ? "l" : ""} ${k === key ? (dir > 0 ? "asc" : "desc") : ""}" data-k="${k}">${l}</th>`).join("")}</tr></thead><tbody>
    ${rows.map((r) => `<tr>${cols.map((c) => c[0] === "name" ? `<td class="l"><span class="name" data-pid="${r.player_id}">${esc(r.name)}</span>${r.official ? `<span class="tag" title="공식 시즌 기록에 두산 경기 밖 기록이 포함됨 (시즌 중 이적 등) · 이 표는 두산 경기 기록">이적</span>` : ""}</td>` : `<td>${fmt(r, c)}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div>`;
}

function teamView() {
  const t = DATA.stages[stage] && DATA.stages[stage].team;
  if (!t) return `<div class="empty">기록 없음</div>`;
  const dash = (v) => v == null ? "-" : v;
  const pct = (v) => v == null ? "-" : `<span class="${v > .5 ? "pos" : v < .5 ? "neg" : ""}">${rate(v)}</span>`;
  const diff = (n) => `<span class="${n > 0 ? "pos" : n < 0 ? "neg" : ""}">${n > 0 ? "+" : ""}${n}</span>`;
  const table = (head, rows) => `<div class="scroll"><table><thead><tr>${head.map((h, i) => `<th class="${i === 0 ? "l" : ""}">${h}</th>`).join("")}</tr></thead><tbody>${rows.map((cells) => `<tr>${cells.map((c, i) => `<td class="${i === 0 ? "l" : ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  const rec = (r) => [r.g, r.w, r.l, r.d, pct(r.pct), r.rs, r.ra, diff(r.rs - r.ra)];
  const REC = ["경기", "승", "패", "무", "승률", "득점", "실점", "득실"];

  const bat = table(["구분", "경기", "득점", "경기당", "안타", "2루타", "3루타", "홈런", "볼넷", "사구", "삼진", "도루", "병살", "실책", "타율", "출루율", "장타율", "OPS"],
    t.batting.map((b) => [`<b>${esc(b.label)}</b>`, b.g, b.r, rate(b.rpg, 2), b.h, b.b2, b.b3, b.hr, b.bb, b.hbp, b.so, b.sb, b.gidp, b.e, rate(b.avg), rate(b.obp), rate(b.slg), rate(b.ops)]));
  const pit = table(["구분", "등판", "승", "패", "세", "홀", "이닝", "평균 이닝", "피안타", "피홈런", "볼넷", "삼진", "자책", "ERA", "WHIP", "K/9", "BB/9", "QS"],
    t.pitching.map((p) => [`<b>${esc(p.label)}</b>`, p.g, p.w, p.l, p.sv, p.hld, esc(p.ip), esc(dash(p.ip_avg)), p.h, p.hr, p.bb, p.so, p.er, rate(p.era, 2), rate(p.whip, 2), rate(p.k9, 2), rate(p.bb9, 2), dash(p.qs)]));
  const splits = table(["구분", ...REC], t.splits.map((s) => [esc(s.label), ...rec(s)]));
  const group = (rows) => table(["", ...REC, "팀 타율", "팀 ERA"], rows.map((r) => [`<b>${esc(r.label)}</b>`, ...rec(r), rate(r.avg), rate(r.era, 2)]));

  return `<div class="sec">
    <h3>팀 타격 · 수비</h3>
    <p class="note">상대 팀 = 두산 경기에서 상대 팀이 기록한 성적 · 실책은 각 팀 수비 실책</p>${missNote("batting")}${bat}
    <h3>투수진</h3>
    <p class="note">QS = 선발 6이닝 이상 3자책 이하 · 전체 이닝·자책·ERA는 박스스코어의 팀 합계 기준 (공식 규칙상 팀 자책점은 선발+불펜 합보다 적을 수 있음)</p>${missNote("pitching")}${t.noTeamTotals ? `<p class="note warn">ⓘ ${t.noTeamTotals}경기는 자료에 팀 투구 합계가 없어 개인 기록 합으로 계산했습니다 (공식 팀 ERA와 0.01~0.02 차이 날 수 있음)</p>` : ""}${pit}
    <div class="grid2">
      <div><h3>상황별 성적</h3><p class="note">역전승 ${t.comebacks.wins} · 역전패 ${t.comebacks.losses}</p>${splits}</div>
      <div><h3>상대 팀별</h3><p class="note">승률 순</p>${group(t.opponents)}</div>
    </div>
    <h3>월별</h3>${group(t.months)}
  </div>`;
}

// ── 선수 탭 ── 포지션별로 묶어 등번호 순으로 카드를 보여준다 (사진은 이미지 주소에서 바로 불러옴)
const GROUP_ORDER = ["투수", "포수", "내야수", "외야수", "지명타자", "야수"];
const pinfo = (pid) => DATA.players[pid] || {};
const photo = (pid, name, cls = "") => {
  const img = pinfo(pid).image;
  return `<div class="ph ${cls}"><span>${esc((name || "?").slice(0, 1))}</span>${img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>`;
};

function playersView() {
  const s = DATA.stages[stage];
  if (!s) return `<div class="empty">기록 없음</div>`;
  const bat = new Map(s.batting.map((r) => [r.player_id, r]));
  const pit = new Map(s.pitching.map((r) => [r.player_id, r]));
  const groups = {};
  for (const pid of new Set([...bat.keys(), ...pit.keys()])) (groups[pinfo(pid).group || "야수"] ||= []).push(pid);
  const num = (pid) => { const n = parseInt(pinfo(pid).no, 10); return Number.isNaN(n) ? 1000 : n; };
  const card = (pid) => {
    const p = pinfo(pid), b = bat.get(pid), pt = pit.get(pid);
    const name = (pt || b).name;
    const line = p.group === "투수" && pt
      ? `${pt.g}경기 ${pt.w}승 ${pt.l}패${pt.sv ? ` ${pt.sv}세` : ""}${pt.hld ? ` ${pt.hld}홀` : ""} · ERA ${rate(pt.era, 2)}`
      : b ? `${b.g}경기 · 타율 ${rate(b.avg)} · ${b.hr}홈런 ${b.rbi}타점` : `${pt.g}경기 · ERA ${rate(pt.era, 2)}`;
    const moved = (b && b.official) || (pt && pt.official);
    return `<div class="pcard" data-pid="${pid}">${photo(pid, name)}
      <div class="nm">${p.no ? `<span class="pno">${esc(p.no)}</span> ` : ""}${esc(name)}${moved ? `<span class="tag">이적</span>` : ""}</div>
      <div class="ps">${esc([p.pos, p.type].filter(Boolean).join(" · "))}</div><div class="st">${line}</div></div>`;
  };
  const total = Object.values(groups).reduce((n, g) => n + g.length, 0);
  return leaders(s)
    + `<p class="note">${DATA.season} ${esc(s.label)} 출전 선수 ${total}명 · 등번호는 그 시즌 기준, 사진·프로필은 현재 기준 · 카드를 누르면 경기별 기록</p>`
    + GROUP_ORDER.filter((g) => groups[g]).map((g) => `<h3 class="grp">${g} <span class="muted">${groups[g].length}</span></h3>
      <div class="pgrid">${groups[g].sort((a, b) => num(a) - num(b)).map(card).join("")}</div>`).join("");
}

// 팀 내 1위. 타율·OPS·ERA는 규정타석/규정이닝(정규시즌: 경기수×3.1타석, 경기수 이닝) 이상만
function leaders(s) {
  const g = s.record.g;
  const regular = stage === "regular";
  const minPa = regular ? Math.floor(g * 3.1) : g, minOuts = regular ? g * 3 : g;
  const cats = [
    ["타율", s.batting.filter((r) => r.pa >= minPa), "avg", 1, (v) => rate(v)],
    ["홈런", s.batting, "hr", 1, (v) => v],
    ["타점", s.batting, "rbi", 1, (v) => v],
    ["도루", s.batting, "sb", 1, (v) => v],
    ["OPS", s.batting.filter((r) => r.pa >= minPa), "ops", 1, (v) => rate(v)],
    ["ERA", s.pitching.filter((r) => r.outs >= minOuts), "era", -1, (v) => rate(v, 2)],
    ["승", s.pitching, "w", 1, (v) => v],
    ["세이브", s.pitching, "sv", 1, (v) => v],
    ["홀드", s.pitching, "hld", 1, (v) => v],
    ["탈삼진", s.pitching, "so", 1, (v) => v],
  ];
  const cards = cats.map(([label, rows, key, dir, fmt]) => {
    const vals = rows.filter((r) => r[key] != null);
    if (!vals.length) return "";
    const best = dir > 0 ? Math.max(...vals.map((r) => r[key])) : Math.min(...vals.map((r) => r[key]));
    if (dir > 0 && !best) return "";  // 모두 0이면 생략 (예: 시범경기 세이브)
    const top = vals.filter((r) => r[key] === best);
    const r = top[0];
    return `<div class="lead pcard" data-pid="${r.player_id}">${photo(r.player_id, r.name, "sm")}
      <div><div class="lk">${label}</div><div class="nm">${esc(r.name)}${top.length > 1 ? ` <span class="muted">외 ${top.length - 1}명</span>` : ""}</div>
      <div class="lv">${fmt(best)}</div></div></div>`;
  }).join("");
  return cards ? `<h3 class="grp">팀 내 1위 <span class="muted">${regular ? `타율·OPS 규정타석 ${minPa}, ERA 규정이닝 ${g}` : ""}</span></h3><div class="leads">${cards}</div>` : "";
}

// ── 시즌 흐름 ── 정규시즌 경기 순서대로: 순위 추이, 승패 마진(5할 기준), 월별 득실점
const SVGNS = "http://www.w3.org/2000/svg";
const svgEl = (parent, tag, attrs = {}, text) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  parent.appendChild(e);
  return e;
};
const signed = (n) => (n > 0 ? `+${n}` : `${n}`);
const niceStep = (span) => [1, 2, 5, 10, 20, 25, 50, 100, 200].find((s) => span / s <= 5) || 500;

function flowData() {
  let w = 0, l = 0, d = 0;
  return finals.filter((g) => g.stage === "regular").map((g) => {
    if (g.result === "W") w++; else if (g.result === "L") l++; else d++;
    return { g, w, l, d, margin: w - l, rank: g.rank };
  });
}

function flowView() {
  const pts = flowData();
  if (!pts.length) return `<div class="empty">정규시즌 경기가 없습니다</div>`;
  const reg = DATA.stages.regular;
  const rows = pts.map((p) => `<tr><td class="l">${fmtDate(p.g.date)}</td><td class="l">${opp(p.g)}</td>
    <td><span class="res ${p.g.result}">${RES[p.g.result]}</span> ${p.g.ts}:${p.g.os}</td><td>${p.w}승 ${p.l}패 ${p.d}무</td>
    <td>${signed(p.margin)}</td><td>${p.rank ? `${p.rank}위` : "-"}</td></tr>`).join("");
  return `<div class="sec">
    <p class="note">정규시즌 ${pts.length}경기 · 그래프에 마우스를 올리거나 클릭 후 ←/→ 키로 경기별 값을 볼 수 있습니다</p>
    <h3>순위 추이</h3><p class="note">그 경기 직후 순위 · 위로 갈수록 높은 순위 · 색 띠는 포스트시즌 진출권</p>
    <div class="chart" id="chRank" tabindex="0" aria-label="경기별 순위 추이"></div>
    <h3>승패 마진</h3><p class="note">승 − 패 (0 = 5할) · 파란 영역은 5할 위, 빨간 영역은 5할 아래</p>
    <div class="chart" id="chMargin" tabindex="0" aria-label="경기별 승패 마진"></div>
    ${reg && reg.team.months.length ? `<h3>월별 득실점</h3>
      <div class="legend"><span><i style="background: var(--s1)"></i>득점</span><span><i style="background: var(--s2)"></i>실점</span></div>
      <div class="chart" id="chMonth" tabindex="0" aria-label="월별 득점과 실점"></div>` : ""}
    <details style="margin-top: 10px"><summary class="note" style="cursor: pointer">표로 보기 (경기별 누적 성적·승패 마진·순위)</summary>
      <div class="scroll" style="max-height: 320px; overflow: auto"><table><thead><tr><th class="l">날짜</th><th class="l">상대</th><th>결과</th><th>누적</th><th>마진</th><th>순위</th></tr></thead>
      <tbody>${rows}</tbody></table></div></details></div>`;
}

// 그래프 틀: 너비는 들어갈 자리에 맞추고, 아래 여백에 x축 글자가 들어가게 높이를 잡는다
function frame(el, { height = 220, left = 40, right = 48, top = 16, bottom = 26 } = {}) {
  const W = Math.max(300, el.clientWidth), H = height;
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
  el.replaceChildren(svg);
  return { el, svg, W, H, x0: left, x1: W - right, y0: top, y1: H - bottom };
}

// x축: 각 달의 첫 경기 위치에 "4월" 같은 표시. 다음 달과 너무 가까우면(3월처럼 경기가 적은 달) 글자는 생략
function monthTicks(f, pts, x) {
  const ticks = [];
  pts.forEach((p, i) => {
    const m = p.g.date.slice(5, 7);
    if (!ticks.length || ticks[ticks.length - 1].m !== m) ticks.push({ m, px: x(i) });
  });
  ticks.forEach((t, k) => {
    svgEl(f.svg, "line", { x1: t.px, x2: t.px, y1: f.y1, y2: f.y1 + 4, class: "base" });
    if (ticks[k + 1] && ticks[k + 1].px - t.px < 32) return;
    svgEl(f.svg, "text", { x: t.px + 2, y: f.y1 + 16, class: "tick" }, `${+t.m}월`);
  });
}

// 십자선 + 툴팁: 포인터와 가장 가까운 경기에 붙고, 포커스 후 ←/→ 키로도 움직인다
function crosshair(f, n, x, yAt, rowsAt) {
  const line = svgEl(f.svg, "line", { y1: f.y0, y2: f.y1, class: "xh", visibility: "hidden" });
  const dot = svgEl(f.svg, "circle", { r: 5, class: "xdot", visibility: "hidden" });
  const tip = document.createElement("div");
  tip.className = "ctip";
  tip.hidden = true;
  f.el.appendChild(tip);
  let cur = -1;
  const show = (i) => {
    cur = Math.max(0, Math.min(n - 1, i));
    const cx = x(cur), cy = yAt(cur);
    line.setAttribute("x1", cx); line.setAttribute("x2", cx); line.setAttribute("visibility", "visible");
    if (cy == null) dot.setAttribute("visibility", "hidden");
    else { dot.setAttribute("cx", cx); dot.setAttribute("cy", cy); dot.setAttribute("visibility", "visible"); }
    tip.replaceChildren(...rowsAt(cur).map(([value, label]) => {
      const row = document.createElement("div");
      const b = document.createElement("b"); b.textContent = value;
      const s = document.createElement("span"); s.className = "tt"; s.textContent = label ? ` ${label}` : "";
      row.append(b, s);
      return row;
    }));
    tip.hidden = false;
    const left = cx + 12 + tip.offsetWidth > f.W ? cx - 12 - tip.offsetWidth : cx + 12;
    tip.style.left = `${left}px`;
    tip.style.top = `${f.y0}px`;
  };
  const hide = () => { line.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tip.hidden = true; };
  const hit = svgEl(f.svg, "rect", { x: f.x0, y: f.y0, width: f.x1 - f.x0, height: f.y1 - f.y0, fill: "transparent" });
  hit.addEventListener("pointermove", (e) => {
    const px = (e.offsetX / f.svg.clientWidth) * f.W;
    show(Math.round(((px - f.x0) / (f.x1 - f.x0)) * (n - 1)));
  });
  hit.addEventListener("pointerleave", hide);
  f.el.onfocus = () => show(cur < 0 ? n - 1 : cur);
  f.el.onblur = hide;
  f.el.onkeydown = (e) => {
    if (e.key === "ArrowLeft") { show(cur - 1); e.preventDefault(); }
    if (e.key === "ArrowRight") { show(cur + 1); e.preventDefault(); }
    if (e.key === "Escape") hide();
  };
}

const gameLine = (p) => [`${fmtDate(p.g.date)} ${p.g.ha === "H" ? "vs" : "@"} ${p.g.opp}`, `${RES[p.g.result]} ${p.g.ts}:${p.g.os}`];

function rankChart(el, pts) {
  const teams = (DATA.league && DATA.league.teams.length) || 10;
  const cut = DATA.season <= 2014 ? 4 : 5;
  const f = frame(el, { height: 230 });
  const n = pts.length;
  const x = (i) => f.x0 + (n < 2 ? 0 : (i / (n - 1)) * (f.x1 - f.x0));
  const y = (r) => f.y0 + ((r - 1) / (teams - 1)) * (f.y1 - f.y0);
  const half = (f.y1 - f.y0) / (teams - 1) / 2;
  // 포스트시즌 진출권 띠 (설명은 그래프 위 문구에 — 띠 안에 글자를 두면 선과 겹친다)
  svgEl(f.svg, "rect", { x: f.x0, y: f.y0 - half, width: f.x1 - f.x0, height: y(cut) + half - (f.y0 - half), class: "band" });
  for (let r = 1; r <= teams; r++) {
    svgEl(f.svg, "line", { x1: f.x0, x2: f.x1, y1: y(r), y2: y(r), class: "grid" });
    svgEl(f.svg, "text", { x: f.x0 - 8, y: y(r) + 4, class: "tick", "text-anchor": "end" }, `${r}위`);
  }
  monthTicks(f, pts, x);
  let d = "";
  pts.forEach((p, i) => { if (p.rank) d += `${d && pts[i - 1] && pts[i - 1].rank ? "L" : "M"}${x(i)},${y(p.rank)}`; });
  svgEl(f.svg, "path", { d, class: "ln" });
  const last = [...pts].reverse().find((p) => p.rank);
  if (last) {
    const i = pts.indexOf(last);
    svgEl(f.svg, "circle", { cx: x(i), cy: y(last.rank), r: 4, class: "end" });
    svgEl(f.svg, "text", { x: x(i) + 8, y: y(last.rank) + 4, class: "lbl" }, `${last.rank}위`);
  }
  crosshair(f, n, x, (i) => (pts[i].rank ? y(pts[i].rank) : null), (i) => {
    const p = pts[i];
    return [[p.rank ? `${p.rank}위` : "순위 정보 없음", ""], [gameLine(p)[0], gameLine(p)[1]]];
  });
}

function marginChart(el, pts) {
  const f = frame(el, { height: 220 });
  const n = pts.length;
  const ms = pts.map((p) => p.margin);
  const step = niceStep(Math.max(1, Math.max(...ms, 0) - Math.min(...ms, 0)));
  const lo = Math.floor(Math.min(0, ...ms) / step) * step, hi = Math.max(step, Math.ceil(Math.max(0, ...ms) / step) * step);
  const x = (i) => f.x0 + (n < 2 ? 0 : (i / (n - 1)) * (f.x1 - f.x0));
  const y = (v) => f.y1 - ((v - lo) / (hi - lo)) * (f.y1 - f.y0);
  for (let v = lo; v <= hi; v += step) {
    svgEl(f.svg, "line", { x1: f.x0, x2: f.x1, y1: y(v), y2: y(v), class: v === 0 ? "base" : "grid" });
    svgEl(f.svg, "text", { x: f.x0 - 8, y: y(v) + 4, class: "tick", "text-anchor": "end" }, signed(v));
  }
  monthTicks(f, pts, x);
  // 선과 0선 사이를 칠하되, 0선 위는 파랑·아래는 빨강만 보이게 잘라낸다
  const id = `m${Math.random().toString(36).slice(2, 7)}`;
  const defs = svgEl(f.svg, "defs");
  svgEl(svgEl(defs, "clipPath", { id: `${id}p` }), "rect", { x: f.x0, y: f.y0 - 4, width: f.x1 - f.x0, height: y(0) - f.y0 + 4 });
  svgEl(svgEl(defs, "clipPath", { id: `${id}n` }), "rect", { x: f.x0, y: y(0), width: f.x1 - f.x0, height: f.y1 - y(0) + 4 });
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i)},${y(p.margin)}`).join("");
  const area = `${line}L${x(n - 1)},${y(0)}L${x(0)},${y(0)}Z`;
  svgEl(f.svg, "path", { d: area, class: "pos", "clip-path": `url(#${id}p)` });
  svgEl(f.svg, "path", { d: area, class: "neg", "clip-path": `url(#${id}n)` });
  svgEl(f.svg, "path", { d: line, class: "ln" });
  const lastP = pts[n - 1];
  svgEl(f.svg, "circle", { cx: x(n - 1), cy: y(lastP.margin), r: 4, class: "end" });
  svgEl(f.svg, "text", { x: x(n - 1) + 8, y: y(lastP.margin) + 4, class: "lbl" }, signed(lastP.margin));
  crosshair(f, n, x, (i) => y(pts[i].margin), (i) => {
    const p = pts[i];
    return [[signed(p.margin), `(${p.w}승 ${p.l}패 ${p.d}무)`], [gameLine(p)[0], gameLine(p)[1]]];
  });
}

function monthChart(el, months) {
  const f = frame(el, { height: 210, right: 12 });
  const max = Math.max(1, ...months.flatMap((m) => [m.rs, m.ra]));
  const step = niceStep(max);
  const hi = Math.ceil(max / step) * step;
  const y = (v) => f.y1 - (v / hi) * (f.y1 - f.y0);
  for (let v = 0; v <= hi; v += step) {
    svgEl(f.svg, "line", { x1: f.x0, x2: f.x1, y1: y(v), y2: y(v), class: v === 0 ? "base" : "grid" });
    svgEl(f.svg, "text", { x: f.x0 - 8, y: y(v) + 4, class: "tick", "text-anchor": "end" }, v);
  }
  const band = (f.x1 - f.x0) / months.length;
  const bw = Math.max(4, Math.min(24, (band - 16) / 2));
  const bar = (bx, v, cls) => {  // 윗면만 4px 둥글게, 바닥은 기준선에 각지게
    const top = y(v), r = Math.min(4, (f.y1 - top) / 2, bw / 2);
    svgEl(f.svg, "path", { class: cls, d: `M${bx},${f.y1}V${top + r}Q${bx},${top} ${bx + r},${top}H${bx + bw - r}Q${bx + bw},${top} ${bx + bw},${top + r}V${f.y1}Z` });
  };
  const tip = document.createElement("div");
  tip.className = "ctip";
  tip.hidden = true;
  months.forEach((m, i) => {
    const cx = f.x0 + band * i + band / 2;
    const hit = svgEl(f.svg, "rect", { x: f.x0 + band * i + 2, y: f.y0, width: band - 4, height: f.y1 - f.y0, rx: 6, class: "hit", tabindex: -1 });
    bar(cx - bw - 1, m.rs, "b1");  // 두 막대 사이 2px 틈
    bar(cx + 1, m.ra, "b2");
    svgEl(f.svg, "text", { x: cx, y: f.y1 + 16, class: "tick", "text-anchor": "middle" }, m.label);
    const showTip = () => {
      f.svg.querySelectorAll(".hit.on").forEach((h) => h.classList.remove("on"));
      hit.classList.add("on");
      const row = (key, value, label) => {
        const d = document.createElement("div");
        if (key) { const k = document.createElement("span"); k.className = "key"; k.style.background = key; d.append(k); }
        const b = document.createElement("b"); b.textContent = value;
        const s = document.createElement("span"); s.className = "tt"; s.textContent = ` ${label}`;
        d.append(b, s);
        return d;
      };
      tip.replaceChildren(row(null, m.label, `${m.w}승 ${m.l}패 ${m.d}무`), row("var(--s1)", m.rs, "득점"), row("var(--s2)", m.ra, "실점"), row(null, signed(m.rs - m.ra), "득실"));
      tip.hidden = false;
      const left = cx + band / 2 + tip.offsetWidth > f.W ? cx - band / 2 - tip.offsetWidth : cx + band / 2;
      tip.style.left = `${left}px`;
      tip.style.top = `${f.y0}px`;
    };
    hit.addEventListener("pointerenter", showTip);
    hit.addEventListener("focus", showTip);
  });
  el.appendChild(tip);
  f.svg.addEventListener("pointerleave", () => { tip.hidden = true; f.svg.querySelectorAll(".hit.on").forEach((h) => h.classList.remove("on")); });
  let cur = -1;
  const hits = [...f.svg.querySelectorAll(".hit")];
  el.onkeydown = (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    cur = Math.max(0, Math.min(hits.length - 1, cur + (e.key === "ArrowRight" ? 1 : -1)));
    hits[cur].dispatchEvent(new Event("pointerenter"));
    e.preventDefault();
  };
  el.onblur = () => { tip.hidden = true; };
}

function drawFlow() {
  const pts = flowData();
  if (!pts.length) return;
  if ($("#chRank")) rankChart($("#chRank"), pts);
  if ($("#chMargin")) marginChart($("#chMargin"), pts);
  if ($("#chMonth")) monthChart($("#chMonth"), DATA.stages.regular.team.months);
}

// ── 역대 기록 ── 시즌별 팀 성적과 2008년 이후 한 시즌 개인 기록 순위
const seasonHref = (s) => s === DATA.seasons[0] ? "index.html" : `${s}.html`;

function historyView() {
  const H = DATA.history;
  if (!H) return `<div class="empty">기록 없음</div>`;
  const diff = (n) => `<span class="${n > 0 ? "pos" : n < 0 ? "neg" : ""}">${n > 0 ? "+" : ""}${n}</span>`;
  const seasonRows = H.seasons.slice().reverse().map((r) => `<tr class="${r.post === "우승" ? "champ" : ""}">
    <td class="l"><a href="${seasonHref(r.season)}">${r.season}</a>${r.season === DATA.season ? ' <span class="muted">(현재 페이지)</span>' : ""}</td>
    <td>${r.rank ? `${r.rank}위` : "-"}</td><td>${r.g}</td><td>${r.w}</td><td>${r.l}</td><td>${r.d}</td><td>${rate(r.pct)}</td>
    <td>${r.rs}</td><td>${r.ra}</td><td>${diff(r.rs - r.ra)}</td><td class="l post">${r.post ? esc(r.post) : '<span class="muted">-</span>'}</td></tr>`).join("");
  const fmt = (f, v) => f === "avg" ? rate(v) : f === "era" ? rate(v, 2) : v;
  const cards = H.records.map((c) => `<div class="rec"><div class="rk">${esc(c.label)}</div><ol>${c.rows.map((r) =>
    `<li><a href="${seasonHref(r.season)}#p=${r.pid}">${esc(r.name)}</a> <span class="muted">${r.season}</span><b>${fmt(c.fmt, r.value)}</b></li>`).join("")}</ol></div>`).join("");
  return `<div class="sec">
    <h3>시즌별 성적</h3><p class="note">정규시즌 기준 · 시즌을 누르면 그 시즌 페이지로 이동</p>
    <div class="scroll"><table><thead><tr><th class="l">시즌</th><th>순위</th><th>경기</th><th>승</th><th>패</th><th>무</th><th>승률</th><th>득점</th><th>실점</th><th>득실</th><th class="l">포스트시즌</th></tr></thead>
    <tbody>${seasonRows}</tbody></table></div>
    <h3>한 시즌 개인 기록 (${H.seasons[0].season}~)</h3>
    <p class="note">두산 소속 정규시즌 기록 · 타율·OPS는 규정타석, ERA는 규정이닝 이상 · 이름을 누르면 그 시즌 경기별 기록</p>
    <div class="recs">${cards}</div></div>`;
}

// 다른 시즌 페이지에서 '시즌.html#p=선수ID'로 넘어오면 그 선수 기록 창을 바로 연다
function openFromHash() {
  const m = location.hash.match(/^#p=(\w+)$/);
  if (m && finals.some((g) => g.bat.some((b) => b.pid === m[1]) || g.pit.some((p) => p.pid === m[1]))) playerLog(m[1]);
}

// 선수 창 맨 위 프로필
function profileHeader(pid, name) {
  const p = DATA.players[pid];
  if (!p) return "";
  const facts = [
    ["포지션", [p.pos, p.type].filter(Boolean).join(" · ")],
    ["생년월일", p.birth ? p.birth.replaceAll("-", ".") : ""],
    ["키 / 몸무게", p.height ? `${p.height}cm / ${p.weight}kg` : ""],
    ["출신", p.career], ["드래프트", p.draft], ["연봉", p.salary],
    [`${DATA.season} WAR`, p.war != null ? p.war.toFixed(2) : ""],
  ].filter(([, v]) => v);
  return `<div class="prof">${photo(pid, name, "big")}<div>
    <div class="pt">${p.no ? `<span class="pno">${esc(p.no)}</span> ` : ""}<b>${esc(name)}</b></div>
    <dl>${facts.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div></div>`;
}

// 시즌 중 다른 팀에서 뛴 선수: 두산 기록과 공식 시즌 기록을 나란히 보여준다
function transferNotice(pid) {
  const reg = DATA.stages.regular;
  if (!reg) return "";
  const b = reg.batting.find((r) => r.player_id === pid && r.official);
  const p = reg.pitching.find((r) => r.player_id === pid && r.official);
  if (!b && !p) return "";
  const row = (label, text) => `<div class="nrow"><span>${label}</span><span>${text}</span></div>`;
  let rows = "";
  if (b) rows += row("두산 기록", `${b.g}경기 ${b.ab}타수 ${b.h}안타 · 타율 <b>${rate(b.avg)}</b>`)
    + row("시즌 전체(공식)", `타율 <b>${rate(b.official.avg)}</b>`);
  if (p) rows += row("두산 기록", `${p.g}경기 ${p.w}승 ${p.l}패 ${p.sv}세 · ERA <b>${rate(p.era, 2)}</b>`)
    + row("시즌 전체(공식)", `${p.official.g}경기 ${p.official.w}승 ${p.official.l}패 ${p.official.sv}세 · ERA <b>${rate(p.official.era, 2)}</b>`);
  return `<div class="notice"><div class="nt"><span class="tag">이적</span> 공식 시즌 기록에 두산 경기 밖의 기록이 포함되어 있습니다 (시즌 중 이적 등). 이 페이지의 기록은 두산 경기만 합친 값입니다.</div>${rows}</div>`;
}

function playerLog(pid) {
  const bat = [], pit = [];
  let name = "";
  for (const g of finals) {
    const b = g.bat.find((x) => x.pid === pid); if (b) { bat.push([g, b]); name = b.name; }
    const p = g.pit.find((x) => x.pid === pid); if (p) { pit.push([g, p]); name = p.name; }
  }
  const when = (g) => `<td class="l">${fmtDate(g.date)} <span class="muted">${esc(g.round === "정규시즌" ? "" : g.round)}</span></td><td class="l">${opp(g)} <span class="res ${g.result}">${RES[g.result]}</span></td>`;
  let html = "";
  if (pit.length) {
    const [body, more] = paged("log-pit", pit.reverse().map(([g, p]) => `<tr>${when(g)}<td>${DEC[p.dec] || (p.gs ? "선발" : "")}</td><td>${esc(p.ip)}</td><td>${p.h}</td><td>${p.r}</td><td>${p.er}</td><td>${p.bb}</td><td>${p.so}</td><td>${p.np}</td></tr>`));
    html += `<h3>투구 기록 (${pit.length}경기)</h3><div class="scroll"><table><thead><tr><th class="l">날짜</th><th class="l">상대</th><th>결과</th><th>이닝</th><th>피안타</th><th>실점</th><th>자책</th><th>볼넷</th><th>삼진</th><th>투구수</th></tr></thead>${body}</table></div>${more}`;
  }
  const realBat = bat.filter(([, b]) => b.pa > 0 || b.pos !== "투");
  if (realBat.length) {
    const [body, more] = paged("log-bat", realBat.reverse().map(([g, b]) => `<tr>${when(g)}<td class="l">${esc(b.pos)}</td><td>${b.ab}</td><td>${b.r}</td><td>${b.h}</td><td>${b.hr}</td><td>${b.rbi}</td><td>${b.bb}</td><td>${b.so}</td><td class="pa">${esc(b.res)}</td></tr>`));
    html += `<h3>타격 기록 (${realBat.length}경기)</h3><div class="scroll"><table><thead><tr><th class="l">날짜</th><th class="l">상대</th><th class="l">위치</th><th>타수</th><th>득점</th><th>안타</th><th>홈런</th><th>타점</th><th>볼넷</th><th>삼진</th><th class="l">타석 결과</th></tr></thead>${body}</table></div>${more}`;
  }
  $("#dlgTitle").textContent = `${name} — ${DATA.season} 경기별 기록`;
  $("#dlgBody").innerHTML = profileHeader(pid, name) + transferNotice(pid) + (html || `<div class="empty">기록 없음</div>`);
  $("#dlg").showModal();
}

function render() {
  tabs();
  $("#view").innerHTML = view === "games" ? gamesView() : view === "team" ? teamView() : view === "players" ? playersView()
    : view === "history" ? historyView() : view === "flow" ? flowView() : statsView(view);
  if (view === "flow") drawFlow();  // 그래프는 자리가 생긴 뒤 너비에 맞춰 그린다
  document.querySelectorAll("th.sort").forEach((th) => th.onclick = () => {
    const st = sortState[view];
    sortState[view] = [th.dataset.k, st[0] === th.dataset.k ? -st[1] : (th.dataset.k === "name" ? 1 : -1)];
    if (["era", "whip"].includes(th.dataset.k) && st[0] !== th.dataset.k) sortState[view][1] = 1;
    render();
  });
  const q = $("#qual"); if (q) q.onchange = () => { qualifiedOnly = q.checked; render(); };
}

document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.classList.contains("name")) return playerLog(t.dataset.pid);
  const more = t.closest("[data-more]");
  if (more) return showMore(more.dataset.more);
  const card = t.closest(".pcard");
  if (card) return playerLog(card.dataset.pid);
  const tr = t.closest("tr.game");
  if (tr) toggleBox(tr);
});
header(); upcoming(); standings(); render(); openFromHash();
window.addEventListener("hashchange", openFromHash);
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (view === "flow") drawFlow(); }, 150); });
// 창을 닫으면 주소의 #p=… 를 지워, 같은 링크를 다시 눌러도 열리게 한다
$("#dlg").addEventListener("close", () => { if (location.hash) history.replaceState(null, "", location.pathname + location.search); });
$("#foot").textContent = `경기 ${finals.length}개 기록됨`;
</script>
</body>
</html>
